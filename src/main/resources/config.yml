# EFF (Energy Force Field) configuration
#
# ============================================================================
# PERMISSIONS (for reference only - these are NOT set in this file. Grant
# them with your permissions plugin, e.g. LuckPerms, or rely on the "op"
# defaults below if you don't use one.)
# ============================================================================
#
# Every node defaults to "op", so an op-only server works with zero setup.
# To let non-op players use EFF without risking grief, grant only the
# specific nodes you trust them with instead of forcefield.admin.
#
#   forcefield.*             (default: false) - every EFF permission, same as forcefield.admin
#   forcefield.admin         (default: op)    - manage ANY zone regardless of owner (chat commands,
#                                                GUI, admin book), reassign ownership, link/unlink
#                                                redstone, reload config - implies forcefield.use
#   forcefield.use           (default: op)    - umbrella node: opens /eff_tools and implies every
#                                                node below, so a plain op server needs nothing else
#   forcefield.tool.rod      (default: false) - pick up and use the Create/Delete rod
#   forcefield.tool.crystal  (default: false) - pick up and use the Remote On/Off crystal
#   forcefield.tool.beacon   (default: false) - pick up and use the Force Field Generator (bubble fields)
#   forcefield.tool.book     (default: false) - pick up and use the "My Energy Force Fields" book
#   forcefield.create        (default: false) - create new zones (rod quick-create, /forcefield create)
#   forcefield.delete        (default: false) - delete your own zones (rod, GUI Delete, /forcefield remove)
#   forcefield.rename        (default: false) - rename your own zones
#   forcefield.modify        (default: false) - toggle your own zones on/off (remote, lever, lecterns,
#                                                /forcefield toggle), change public/private access,
#                                                get replacement lecterns
#
# Item nodes and action nodes are independent - e.g. hand a group the rod
# without letting them delete anything, or let a group toggle zones from
# lecterns without giving them the remote. Every action also still requires
# owning the zone (or forcefield.admin) on top of these nodes.
# ============================================================================

# The item used as the Create/Delete tool. Left-click cycles between setting
# corner 1 and corner 2 (setting corner 2 immediately creates the field, then
# the cycle starts over); right-click deletes the nearest field. Must be a
# valid Bukkit Material name.
create-delete-rod-material: LIGHTNING_ROD

# The item used as the On/Off remote. Right-click while looking at a field
# you're allowed to control (within crystal-remote-range) to toggle it - it
# has to actually be in your line of sight, not just nearby. Must be a
# valid Bukkit Material name.
on-off-crystal-material: END_CRYSTAL

# How far (in blocks) the On/Off remote's line-of-sight check reaches.
crystal-remote-range: 10.0

# The item used as the Force Field Generator - placing it creates a spherical
# "bubble" shield centered on itself (a hollow shell, not a solid-filled
# ball). Must be a valid Bukkit Material name.
beacon-field-material: BEACON

# The block a beacon field's shell is actually made of when raised. Unlike a
# rod field (invisible BARRIER, since it's meant to seal a doorway or gap
# unnoticed), a bubble is meant to be seen - defaults to a translucent blue
# glass so it reads clearly as a shield dome. Fully solid and fully protected
# either way; only the look changes. Must be a valid Bukkit Material name and
# should be a solid, non-transparent-to-projectiles block.
beacon-field-shell-material: BLUE_STAINED_GLASS

# The three preset radii (in blocks) offered by a beacon field's own control
# GUI - Small/Medium/Large. The field always starts at the small radius when
# first placed. Large radii are still a lot of blocks (the shell alone, not a
# solid fill) and can trigger noticeable chunk loading if placed somewhere
# mostly unexplored - keep these lower on a survival server if that's a
# concern.
beacon-field-radius-small: 25
beacon-field-radius-medium: 50
beacon-field-radius-large: 75

# How many Force Field Generators a single player can have placed at once,
# across every bubble they own. Deleting one (via its own GUI's Delete
# button) frees up a slot again. Set to 0 to block the tool entirely without
# revoking forcefield.tool.beacon.
beacon-field-max-per-player: 2

# If a player places a second beacon inside one of their own existing
# bubbles, the two merge into a single field instead of creating a separate
# one - whenever both happen to be raised at once, the shell wherever the two
# spheres overlap is removed, so the merged shape reads as one connected
# space rather than two bubbles sealed against each other. Each beacon keeps
# its own radius, its own On/Off lever, and its own Delete button, fully
# independent of the other - merging never disturbs an already-raised
# bubble's own state, and the new beacon always starts off, exactly like a
# brand new field does. Turning one off while the other stays on simply
# reseals the shared wall, leaving the remaining bubble complete on its own
# again. This only ever merges with a zone you own - placing a beacon inside
# someone else's bubble does nothing special. Still counts fully against
# beacon-field-max-per-player above (a merged pair still uses both of your 2
# beacons).

# How many of a beacon field's shell blocks are placed per tick while
# raising it, filled top-down in bands (see beacon-beam-* below for the
# accompanying beam). This is intentionally much slower than lowering by
# default - the shell is genuinely open wherever it hasn't filled in yet, so
# a slow raise gives players a real window to get in or out before it seals,
# not just a cosmetic animation. Raise the number for a faster/more solid-
# feeling shield, lower it for a longer window; at radius 50 the default
# takes several seconds, at radius 250 well over a minute.
sphere-raise-blocks-per-tick: 333

# Same idea, but for lowering - kept fast by default since there's usually no
# reason to drag that out (nothing to protect once it's fully down anyway).
sphere-lower-blocks-per-tick: 8000

# A bubble's surface area is much bigger than a typical rod-selected box, so
# its ambient shimmer scales with shell size instead of using the flat
# ambient-particle-count below (which would look sparse-to-invisible spread
# across a large sphere). Every this-many blocks of shell gets one particle
# per ambient pass - lower this for a denser/more visible shimmer, raise it
# to thin it out. beacon-ambient-particle-cap is a hard ceiling regardless of
# radius, so an oversized bubble can't spam particles into a performance
# problem.
beacon-ambient-blocks-per-particle: 8
beacon-ambient-particle-cap: 20000

# A raised beacon field draws a vertical particle "beam" straight up from the
# beacon to the top of its own bubble (then stops - it doesn't poke out
# through the dome), similar in spirit to a real vanilla beacon's light beam
# - since a real one requires an actual pyramid + a clear shot to the sky
# (checked deep in Minecraft's own code, not something a plugin can just
# switch on), this is a particle stand-in instead: works anywhere, indoors or
# out, no world changes required.
beacon-beam-enabled: true
beacon-beam-particle: END_ROD
beacon-beam-spacing: 1.0

# When a beacon field is raised, the beam extends from 0 up to full length
# first (this many blocks per tick), and only once it's fully extended does
# the shell itself start forming - a "charging up" flourish before the
# bubble begins. This is independent of, and much quicker by default than,
# the shell fill itself (sphere-raise-blocks-per-tick above).
beacon-beam-charge-blocks-per-tick: 5

# How many Force Field Lecterns (the physical on/off switches) a player
# gets when creating a field, and how many the "Get Replacement Lecterns"
# button in the field detail GUI hands out. Set to 0 to disable giving them
# out automatically.
lecterns-per-field: 2

# How long (in milliseconds) between two left-clicks on the same lectern for
# it to count as a "double left-click" and open the field edit menu, instead
# of being treated as two separate single clicks.
lectern-double-click-window-ms: 400

# The icon used for each field entry in the "My Energy Force Fields" list
# GUI (opened from the book slot in /eff_tools). Must be a valid Bukkit
# Material name.
fields-list-icon-material: NETHERITE_NAUTILUS_ARMOR

# Same, but for beacon (bubble) fields specifically - the list groups rod
# fields and beacon fields together by type, each with its own icon, so
# they're easy to tell apart at a glance.
beacon-fields-list-icon-material: BEACON

# The item used as the fields-list book (right-click it to open the list).
# Must be a valid Bukkit Material name.
fields-book-material: WRITTEN_BOOK

# The item used as the admin-only "All Energy Force Fields" book - only ever
# handed out from /eff_tools to players with forcefield.admin, and shows
# every field on the server regardless of owner. Must be a valid Bukkit
# Material name.
admin-fields-book-material: ENCHANTED_BOOK

# How close (in blocks) the Create/Delete rod's right-click delete will
# look for a field to act on.
toggle-tool-range: 8.0

# How long (in milliseconds) a right-click delete confirmation stays valid -
# you must right-click again on the same field within this window.
delete-confirm-window-ms: 5000

# How long (in milliseconds) a Rename request stays open after clicking the
# Rename button, waiting for you to type the new name in chat. If you send
# any chat message after this window closes, it's treated as normal chat
# instead of a name.
rename-window-ms: 30000

# How long (in milliseconds) a Change Owner request (admin book only) stays
# open after clicking the player-head button, waiting for you to type the
# new owner's exact username in chat. The target must be online.
owner-change-window-ms: 30000

# Zones larger than this many blocks require "confirm" as an extra argument
# to /forcefield create (the quick-create via the rod is always capped at
# this size, with no confirm option, to avoid accidentally freezing the
# server with a huge block-fill operation).
max-volume-without-confirm: 5000

# How often (in ticks, 20 ticks = 1 second) the ambient shimmer/hum effect
# runs on every currently-raised field.
ambient-interval-ticks: 40

# How many shimmer particles are scattered across a raised field's surface
# each ambient pass. Turn this down if you have a lot of large fields raised
# at once and notice particle lag.
ambient-particle-count: 420

# How often (in ticks) the top and bottom edge of a raised field is re-traced
# with particles. This is intentionally much more frequent than
# ambient-interval-ticks - particles fade out after roughly a second, so a
# short period here keeps the field's top/bottom boundary continuously
# visible instead of flickering. Cost scales with a field's perimeter, not
# its volume, so this stays cheap even for large fields.
edge-outline-interval-ticks: 4

# Radius (in blocks) within which players hear the ambient hum of a raised field.
ambient-sound-radius: 16

# Cooldown (in milliseconds) before a player gets another "the field resists you"
# effect after punching/breaking a barrier block.
resist-feedback-cooldown-ms: 800

# Particle and sound names below are validated on startup. If your server's
# Paper version doesn't recognize one, EFF falls back to a safe default and
# logs a warning - it will never fail to load because of this. The field's
# signature look uses the crackling sculk_charge_pop particle.
effects:
  activate-sound: BLOCK_BEACON_ACTIVATE
  deactivate-sound: BLOCK_BEACON_DEACTIVATE
  ambient-sound: BLOCK_BEACON_AMBIENT
  resist-sound: ENTITY_ENDERMAN_TELEPORT
  wall-particle: SCULK_CHARGE_POP
  ambient-particle: SCULK_CHARGE_POP
  resist-particle: SCULK_CHARGE_POP

messages:
  prefix: "&b&l[EFF]&r "
  no-permission: "&cYou don't have permission to do that."
  need-selection: "&cLeft-click two corners with the Create/Delete rod first."
  zone-created: "&aEnergy Force Field '&f%name%&a' created (%blocks% blocks). It starts lowered."
  zone-exists: "&cAn Energy Force Field named '&f%name%&c' already exists."
  zone-not-found: "&cNo Energy Force Field named '&f%name%&c' found."
  zone-removed: "&aEnergy Force Field '&f%name%&a' removed."
  zone-raised: "&aEnergy Force Field '&f%name%&a' raised."
  zone-lowered: "&eEnergy Force Field '&f%name%&e' lowered."
  beacon-field-created: "&aForce Field Generator placed - '&f%name%&a' is a %radius%-block bubble, lowered. Right-click it for controls."
  beacon-field-merged: "&aForce Field Generator placed - merged into '&f%name%&a' as a %radius%-block bubble. Right-click it for controls."
  beacon-field-resized: "&aEnergy Force Field '&f%name%&a' bubble radius set to %radius% blocks."
  beacon-limit-reached: "&cYou already have the maximum of %max% Force Field Generators placed. Delete one (via its own GUI) to place another."
  too-large: "&cThat selection is %blocks% blocks, which is over the %max% limit. Re-run with 'confirm' if you're sure: /forcefield create %name% confirm"
  resisted: "&7The energy field resists your efforts."
  link-start: "&eNow left-click the lever, button or redstone block you want to control '&f%name%&e' with."
  link-set: "&aEnergy Force Field '&f%name%&a' is now linked to redstone at %location%."
  link-cleared: "&eEnergy Force Field '&f%name%&e' is no longer linked to redstone."
  reloaded: "&aEFF configuration and zones reloaded."
